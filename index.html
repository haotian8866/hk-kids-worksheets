<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港幼小工作紙資料庫</title><style>
:root{--ink:#21323b;--muted:#6c7c83;--bg:#f4f7f5;--card:#fff;--line:#e2e9e5;--green:#176b55;--pale:#e5f2ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Microsoft JhengHei",sans-serif}header{background:#dceee5;padding:36px max(24px,calc((100% - 1120px)/2)) 30px}h1{margin:0 0 6px;font-size:30px}header p{margin:0;color:#476158}.wrap{max-width:1120px;margin:auto;padding:24px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select{background:white;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;color:var(--ink)}input{flex:1;min-width:230px}.count{color:var(--muted);margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;display:flex;flex-direction:column;min-height:205px}.card h2{font-size:18px;margin:10px 0 6px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;background:var(--pale);color:var(--green);border-radius:20px;padding:3px 9px}.card p{font-size:14px;color:#56666d;margin:0 0 14px}.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.link{color:var(--green);font-weight:650;text-decoration:none}.status{font-size:12px;color:#7a6750}.note{margin:24px 0;padding:14px 16px;background:#fff8e9;border:1px solid #f1dfb4;border-radius:12px;color:#68572f;font-size:14px}.empty{padding:28px;color:var(--muted);grid-column:1/-1}</style><body>
<header><h1>香港幼小工作紙資料庫</h1><p>按學段、年級和科目查找公開學習資源。</p></header><main class="wrap"><section class="tools"><input id="q" placeholder="搜尋網站、主題或關鍵字…"><select id="stage"><option value="">所有學段</option><option>幼稚園</option><option>小學</option></select><select id="grade"><option value="">所有年級</option><option>K1</option><option>K2</option><option>K3</option><option>P1–P3</option><option>P4–P6</option></select><select id="subject"><option value="">所有科目</option><option>中文</option><option>英文</option><option>數學</option><option>常識／人文／科學</option><option>綜合</option></select></section><div class="count" id="count"></div><section class="grid" id="grid"></section><aside class="note">使用提醒：免費下載或列印不代表可重新打包轉售。請逐站確認授權；本資料庫先作來源索引，雲端下載連結待取得 Google Drive 連接後再補。</aside></main><script>
const rows=[
{name:'HK Tutor Link 教學資源',stage:'幼稚園',grade:'K1',subject:'綜合',desc:'K1–K3 活動與語言、數感練習；可按階段、主題及科目瀏覽。',url:'https://hktutorlink.hk/teaching-resources',free:'可閱讀／列印'},
{name:'HK Tutor Link 教學資源',stage:'小學',grade:'P1–P3',subject:'綜合',desc:'小一至小六分年級資源，可按主題或科目查找。',url:'https://hktutorlink.hk/teaching-resources',free:'可閱讀／列印'},
{name:'TutorZone 小學練習卷',stage:'小學',grade:'P1–P3',subject:'中文',desc:'小學中文練習卷及答案，按年級整理。',url:'https://www.tutorzone.com.hk/en-primary-practice-index/',free:'免費列印；核對條款'},
{name:'TutorZone 小學練習卷',stage:'小學',grade:'P1–P3',subject:'英文',desc:'小學英文文法、閱讀及寫作練習卷。',url:'https://www.tutorzone.com.hk/en-primary-practice-index/',free:'免費列印；核對條款'},
{name:'TutorZone 小學練習卷',stage:'小學',grade:'P1–P3',subject:'數學',desc:'按年級整理的數學試卷與答案。',url:'https://www.tutorzone.com.hk/en-primary-practice-index/',free:'免費列印；核對條款'},
{name:'TutorZone 小學練習卷',stage:'小學',grade:'P1–P3',subject:'常識／人文／科學',desc:'小學常識練習卷與答案。',url:'https://www.tutorzone.com.hk/en-primary-practice-index/',free:'免費列印；核對條款'},
{name:'Study River 香港工作紙',stage:'小學',grade:'P1–P3',subject:'中文',desc:'香港課程參考閱讀練習，可預覽並輸出 PDF。',url:'https://studyriver.app/zh-HK/',free:'可產生／列印 PDF'},
{name:'Study River 香港工作紙',stage:'小學',grade:'P1–P3',subject:'數學',desc:'小學計算練習，可選內容並預覽答案。',url:'https://studyriver.app/zh-HK/',free:'可產生／列印 PDF'},
{name:'教育局小學數學教學資料冊',stage:'小學',grade:'P1–P3',subject:'數學',desc:'官方小學數學教學資料，部分內容含工作紙。',url:'https://www.edb.gov.hk/tc/curriculum-development/kla/ma/res/pri/addenda4-numbers.html',free:'官方資源下載'},
{name:'教育局小學常識科學與教資源',stage:'小學',grade:'P4–P6',subject:'常識／人文／科學',desc:'中國歷史文化、地理、理財、健康飲食等主題資源；頁面標註不再更新。',url:'https://www.edb.gov.hk/tc/curriculum-development/cross-kla-studies/gs-primary/references-resources.html',free:'官方資源下載'},
{name:'香港教育大學 Little Leaf',stage:'小學',grade:'P1–P3',subject:'英文',desc:'小學英語短片、電子課本、課程大綱及工作紙。',url:'https://www.littleleaf.hk/',free:'免費學習資源'},
{name:'British Council LearnEnglish Kids',stage:'小學',grade:'P1–P3',subject:'英文',desc:'兒童英語主題活動工作紙，可下載列印。',url:'https://learnenglishkids.britishcouncil.org/print-make/worksheets',free:'免費下載／列印'},
{name:'Worksheetfun',stage:'幼稚園',grade:'K1',subject:'英文',desc:'字母、數字、形狀、剪貼及連線等英文活動。',url:'https://www.worksheetfun.com/',free:'免費頁面；核對條款'},
{name:'Worksheetfun',stage:'幼稚園',grade:'K1',subject:'數學',desc:'基礎數數、數字及簡單運算活動。',url:'https://www.worksheetfun.com/',free:'免費頁面；核對條款'},
{name:'SoftSchools',stage:'幼稚園',grade:'K1',subject:'數學',desc:'英文數學工作紙，涵蓋數數及加減等內容。',url:'https://www.softschools.com/',free:'免費頁面；核對條款'},
{name:'精明師奶幼教分享會',stage:'幼稚園',grade:'K2',subject:'綜合',desc:'PN 至小三中英數及認知活動，含認字、連線和剪貼等。',url:'https://www.shemom.com/hot-topics/幼稚園-學前-幼兒-免費-工作紙',free:'按頁面提供；核對條款'}];
const q=document.querySelector('#q'),stage=document.querySelector('#stage'),grade=document.querySelector('#grade'),subject=document.querySelector('#subject'),grid=document.querySelector('#grid');function render(){let a=rows.filter(x=>(!q.value||Object.values(x).join(' ').toLowerCase().includes(q.value.toLowerCase()))&&(!stage.value||x.stage===stage.value)&&(!grade.value||x.grade===grade.value)&&(!subject.value||x.subject===subject.value));document.querySelector('#count').textContent=a.length+' 項來源紀錄';grid.innerHTML=a.length?a.map(x=>'<article class="card"><div class="tags"><span class="tag">'+x.stage+'</span><span class="tag">'+x.grade+'</span><span class="tag">'+x.subject+'</span></div><h2>'+x.name+'</h2><p>'+x.desc+'</p><div class="foot"><span class="status">'+x.free+'</span><a class="link" href="'+x.url+'" target="_blank" rel="noopener">查看來源 ↗</a></div></article>').join(''):'<div class="empty">沒有符合條件的來源。</div>'} [q,stage,grade,subject].forEach(x=>x.addEventListener('input',render));render();</script></body></html>
